controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    left_wheel_names: [ "front_left_wheel_joint", "rear_left_wheel_joint" ]
    right_wheel_names: [ "front_right_wheel_joint", "rear_right_wheel_joint" ]

    # Separation between a left and right wheels in meters
    wheel_separation: 0.50
    wheel_radius: 0.115

    publish_rate: 30.0
    odom_frame_id: odom
    base_frame_id: base_link

    open_loop: true
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false

    # Preserve turning radius when limiting speed/acceleration/jerk
    # preserve_turning_radius: true

    # Publish limited velocity
    publish_cmd: true

    # Publish wheel data
    publish_wheel_data: true

    # # Velocity and acceleration limits
    # linear.x.has_velocity_limits: true
    # linear.x.has_acceleration_limits: true
    # linear.x.has_jerk_limits: false
    # linear.x.max_velocity: 10.0
    # linear.x.min_velocity: -10.0
    # linear.x.max_acceleration: 2.0
    # linear.x.max_jerk: 0.0
    # linear.x.min_jerk: 0.0

    # angular.z.has_velocity_limits: true
    # angular.z.has_acceleration_limits: true
    # angular.z.has_jerk_limits: false
    # angular.z.max_velocity: 200.0
    # angular.z.min_velocity: -200.0
    # angular.z.max_acceleration: 200.0
    # angular.z.min_acceleration: -200.0
    # angular.z.max_jerk: 0.0
    # angular.z.min_jerk: 0.0